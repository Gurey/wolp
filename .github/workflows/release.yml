name: Release

# Push a version tag to publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: make dist VERSION=${{ github.ref_name }} BUILD=${{ github.run_number }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --title "$TAG (build ${{ github.run_number }})" \
            --generate-notes \
            $([[ "$TAG" == *-* ]] && echo --prerelease)
